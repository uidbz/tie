Username = 'defaultuser'
Password = 'defaultpassword'
Namespace = 'Collections'
Collection = 'Main'
# TripleStoreURL is the tie-triplestore endpoint (the old Webservice key is
# still honored for backward compatibility).
TripleStoreURL = 'http://localhost:2161'
DefaultFileHosts = ['default']
PrevVersions = 3

[FileHosts.default]
URL = 'http://localhost:2162'
Insecure = false
# Store selects a physical store on a multi-store filehost (rides uploads as the
# Tie-Store header). Leave unset for a single-store filehost.
# Store = 'ssd'
# Optional HTTP Basic Auth for a filehost that requires it (AnonymousAccess
# "read" or "none"). Leave unset for an open filehost.
# Username = 'alice'
# Password = 'secret'

[Queries]
outdoor-getaways = 'vacation outdoors'
non-vacation-outdoors = 'outdoors -vacation'

# Multiple collections in one config. Select one with `tie -c <name>` (the -c
# short flag now means --collection; use -C/--config for the config file).
# DefaultCollection picks the one used when -c is omitted. Each entry may
# override the top-level TripleStoreURL / Namespace / credentials / FileHosts; unset
# fields fall back to the top-level values above.
#
# DefaultCollection = 'images'
#
# [Collections.images]
# Namespace = 'Collections'
# Collection = 'images'
# FileHosts = ['media-ssd']
#
# [Collections.archive]
# TripleStoreURL = 'http://archive-box:2161'   # a collection on another triplestore
# Namespace = 'Cold'
# Collection = 'archive'
# FileHosts = ['media-hdd']
