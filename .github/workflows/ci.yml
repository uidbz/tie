name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # vet, staticcheck, govulncheck, and `go test -race` across every
      # package (including examples/, which must keep compiling).
      - run: make check
